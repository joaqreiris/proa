<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="ag.pageTitle">Mi agenda — Proa</title>
<meta name="theme-color" content="#FF3D00">
<link rel="stylesheet" href="proa.css">
<script src="assets/brand.js"></script>
<script src="assets/vendor/supabase-js-2.112.4.min.js"></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/i18n.js" defer></script>
<script src="assets/week-grid.js" defer></script>
<script src="assets/tz.js"></script>
<style>
  .ag { max-width: 980px; }

  .ag-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .ag-nav { display: flex; align-items: center; gap: 8px; }
  .ag-range {
    font: 700 13px/1 var(--pr-font-cond); letter-spacing: .1em; text-transform: uppercase;
    color: var(--pr-fg-strong); min-width: 190px; text-align: center;
  }

  /* Dónde estoy yo. Solo aparece si tengo atletas en otro huso: si están
     todos en mi hora, no hay nada que aclarar. */
  .ag-tz {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 11px 14px; margin-bottom: 18px;
    border-radius: var(--pr-r-4);
    background: var(--pr-bg-sunk);
    font: var(--pr-body-sm); color: var(--pr-fg-muted);
  }
  .ag-tz .ti { color: var(--pr-accent-ink); flex: none; font-size: 17px; margin-top: 1px; }
  .ag-tz b { color: var(--pr-fg-strong); }

  .ag-sum { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 20px; }
  .ag-sum div { display: flex; flex-direction: column; gap: 4px; }
  .ag-sum b { font: 700 26px/1 var(--pr-font-cond); font-variant-numeric: tabular-nums; color: var(--pr-fg-strong); }
  .ag-sum span { font: 700 10px/1 var(--pr-font-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--pr-fg-muted); }
  .ag-sum div.is-accent b { color: var(--pr-accent-ink); }

  /* Un día = una tarjeta. Se lee de arriba abajo, como una agenda de papel. */
  .ag-days { display: flex; flex-direction: column; gap: 12px; }
  .ag-day { padding: 0; overflow: hidden; }
  .ag-day-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 13px 18px;
    border-bottom: var(--pr-bw) solid var(--pr-border);
  }
  .ag-day-head h2 {
    font: 700 13px/1 var(--pr-font-cond); letter-spacing: .12em; text-transform: uppercase;
    color: var(--pr-fg-strong); margin: 0;
  }
  .ag-day.is-today .ag-day-head { background: var(--pr-accent-soft); }
  .ag-day.is-today .ag-day-head h2 { color: var(--pr-accent-ink); }
  .ag-day-head em { font-style: normal; font: var(--pr-meta); color: var(--pr-fg-faint); }
  .ag-day-head .pr-grow { flex: 1; }

  .ag-row {
    display: grid; grid-template-columns: 82px 12px 1fr auto;
    gap: 12px; align-items: center;
    width: 100%; text-align: left;
    padding: 11px 18px;
    border: 0; background: transparent; cursor: pointer;
    border-top: var(--pr-bw) solid var(--pr-border-soft);
    transition: background var(--pr-dur-1) var(--pr-ease);
  }
  .ag-row:first-child { border-top: 0; }
  .ag-row:hover { background: var(--pr-bg-soft); }
  .ag-time {
    font: 700 14px/1.15 var(--pr-font-cond); font-variant-numeric: tabular-nums;
    color: var(--pr-fg-strong);
  }
  .ag-time small { display: block; font: var(--pr-meta); color: var(--pr-fg-faint); font-weight: 400; margin-top: 3px; }
  .ag-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--ag); }
  .ag-what { min-width: 0; }
  .ag-who { font: 600 14px/1.25 var(--pr-font-sans); color: var(--pr-fg-strong); }
  .ag-meta { font: var(--pr-meta); color: var(--pr-fg-muted); margin-top: 3px; }
  .ag-meta b { color: var(--pr-fg-faint); font-weight: 600; }
  .ag-empty { padding: 16px 18px; font: var(--pr-body-sm); color: var(--pr-fg-faint); }

  @media (max-width: 640px) {
    .ag-row { grid-template-columns: 68px 10px 1fr; }
    .ag-row .pr-pill { display: none; }
  }
</style>
</head>
<body class="pr">

<div class="pr-shell">
  <aside class="pr-shell-side" id="pr-side-root"></aside>

  <div class="pr-shell-main">
    <header class="pr-topbar"><h1 data-i18n="nav.agenda">Mi agenda</h1></header>

    <main class="pr-page ag">

      <div class="pr-page-header">
        <div class="pr-grow">
          <h1 data-i18n="ag.title">Mi agenda</h1>
          <p data-i18n="ag.sub">Todo lo que tienen tus atletas esta semana, en tu hora.</p>
        </div>
      </div>

      <div id="no-athletes" class="pr-empty" hidden style="margin-top:20px">
        <i class="ti ti-users"></i>
        <h3 data-i18n="wk.noAthletes.title">Todavía no tienes atletas</h3>
        <p data-i18n="wk.noAthletes.body">Da de alta a uno y carga su anamnesis: sin sus horarios, esta pantalla no puede ayudarte.</p>
        <a class="pr-btn is-primary" href="Athletes.html" style="margin-top:6px" data-i18n="home.empty.cta">Dar de alta un atleta</a>
      </div>

      <div id="board" hidden>
        <div class="ag-bar">
          <div class="ag-nav">
            <button class="pr-icon-btn" id="prev" aria-label="Semana anterior"><i class="ti ti-chevron-left"></i></button>
            <span class="ag-range" id="range"></span>
            <button class="pr-icon-btn" id="next" aria-label="Semana siguiente"><i class="ti ti-chevron-right"></i></button>
            <button class="pr-btn is-sm is-ghost" id="today" data-i18n="wk.today">Hoy</button>
          </div>
        </div>

        <p class="ag-tz" id="tz-note" hidden></p>

        <div class="ag-sum">
          <div class="is-accent"><b id="n-blocks">0</b><span data-i18n="ag.blocks">Bloques</span></div>
          <div><b id="n-hours">0 h</b><span data-i18n="ag.hours">Horas</span></div>
          <div><b id="n-athletes">0</b><span data-i18n="nav.athletes">Atletas</span></div>
        </div>

        <div class="ag-days" id="days"></div>
      </div>

    </main>
  </div>
</div>

<script src="assets/sidebar.js" defer></script>
<script>
(function () {
  const t = (k, fb, vars) => (window.PR_I18N ? window.PR_I18N.t(k, vars) : null) || fb;
  const esc = window.prEsc;
  const W = () => window.prWeek;
  const TZ = () => window.prTz;

  let athletes = [], monday = null, rows = [];
  const myTz = () => TZ().mine();
  const lang = () => (window.PR_I18N && window.PR_I18N.current) || 'es';
  const fullName = (a) => `${a.first_name} ${a.last_name || ''}`.trim();

  // ── Datos ────────────────────────────────────────────────────────────────
  // Se pide un día de más a cada lado. Un entrenamiento del lunes en Montevideo
  // puede caer en martes para alguien en Camboya, y al revés: si se pidieran
  // solo los siete días exactos, en los bordes de la semana faltarían cosas.
  async function load() {
    const dates = W().weekDates(monday);
    const wsId = await window.getWorkspaceId();

    const { data, error } = await window.sb.from('events')
      .select('id,date,start_time,end_time,type,title,location,status,athlete_id,athletes!inner(id,first_name,last_name,timezone,workspace_id)')
      .eq('athletes.workspace_id', wsId)
      .gte('date', W().addDays(dates[0], -1))
      .lte('date', W().addDays(dates[6], 1));
    if (error) { window.prToast(error.message, 'danger'); return; }

    rows = (data || []).map(toMine).filter(Boolean);
    paint();
  }

  // Un evento traducido a mi hora. Lo que se guardó es la hora de reloj del
  // atleta; acá se calcula qué hora es esa PARA MÍ, sin tocar el dato.
  function toMine(e) {
    const a = e.athletes;
    if (!a) return null;
    const tz = TZ().valid(a.timezone) ? a.timezone : myTz();
    const same = tz === myTz();

    // Un bloque sin hora («descanso», «comida libre») no se traduce: no tiene
    // un instante que convertir. Se queda en el día que le pusieron.
    if (!e.start_time) {
      return { ev: e, ath: a, tz, same, ymd: e.date, hhmm: null, endHhmm: null, allday: true };
    }

    const s = TZ().convert(e.date, W().hhmm(e.start_time), tz, myTz());
    const en = e.end_time ? TZ().convert(e.date, W().hhmm(e.end_time), tz, myTz()) : null;
    return {
      ev: e, ath: a, tz, same, allday: false,
      ymd: s.ymd, hhmm: s.hhmm, endHhmm: en ? en.hhmm : null,
      theirStart: W().hhmm(e.start_time),
      theirEnd: e.end_time ? W().hhmm(e.end_time) : null,
      shift: s.shift
    };
  }

  // ── Pintar ───────────────────────────────────────────────────────────────
  function paint() {
    const dates = W().weekDates(monday);
    const a = W().parseYMD(dates[0]), b = W().parseYMD(dates[6]);
    const fd = (d, withYear) => d.toLocaleDateString(lang(),
      { day: 'numeric', month: 'short', year: withYear ? 'numeric' : undefined });
    document.getElementById('range').textContent =
      `${fd(a)} – ${fd(b, a.getFullYear() !== b.getFullYear())}`;

    const week = rows.filter(r => dates.includes(r.ymd));

    let mins = 0;
    week.forEach(r => {
      if (!r.ev.start_time || !r.ev.end_time) return;
      mins += W().toMin(r.ev.end_time) - W().toMin(r.ev.start_time);
    });
    document.getElementById('n-blocks').textContent = week.length;
    document.getElementById('n-hours').textContent = (Math.round(mins / 6) / 10) + ' h';
    document.getElementById('n-athletes').textContent = new Set(week.map(r => r.ath.id)).size;

    paintTzNote();

    const today = window.prToday();
    document.getElementById('days').innerHTML = dates.map(d => {
      const list = week.filter(r => r.ymd === d)
        .sort((x, y) => (x.allday ? '' : x.hhmm || '').localeCompare(y.allday ? '' : y.hhmm || ''));
      const dd = W().parseYMD(d);
      return `
      <section class="pr-card ag-day${d === today ? ' is-today' : ''}">
        <div class="ag-day-head">
          <h2>${esc(dd.toLocaleDateString(lang(), { weekday: 'long', day: 'numeric', month: 'short' }))}</h2>
          <span class="pr-grow"></span>
          <em>${list.length ? esc(t('ag.nBlocks', list.length + ' bloques', { n: list.length })) : ''}</em>
        </div>
        ${list.length ? list.map(rowHtml).join('')
                      : `<p class="ag-empty">${esc(t('ag.dayFree', 'Nada este día.'))}</p>`}
      </section>`;
    }).join('');
  }

  function rowHtml(r) {
    const e = r.ev;
    const color = W().EVENT_COLOR[e.type] || 'var(--pr-fg-faint)';
    const type = t(W().EVENT_KEY[e.type] || 'ev.other');

    // Arriba, mi hora — es la que me dice si voy a estar despierto. Abajo, la
    // del atleta, que es la que se guardó y la que él ve.
    const time = r.allday
      ? `<span style="color:var(--pr-fg-faint)">${esc(t('ag.noTime', 'Sin hora'))}</span>`
      : esc(r.hhmm + (r.endHhmm ? '–' + r.endHhmm : ''));
    const theirs = (!r.allday && !r.same)
      ? `<small>${esc(r.theirStart + (r.theirEnd ? '–' + r.theirEnd : '') + ' ' + TZ().city(r.tz))}</small>` : '';

    const bits = [type, e.title, e.location].filter(Boolean);
    return `
      <button class="ag-row" style="--ag:${color}" data-ev="${e.id}" data-type="${e.type}" data-ath="${r.ath.id}">
        <span class="ag-time">${time}${theirs}</span>
        <span class="ag-dot"></span>
        <span class="ag-what">
          <span class="ag-who">${esc(fullName(r.ath))}</span>
          <span class="ag-meta">${esc(bits.join(' · '))}</span>
        </span>
        ${e.status === 'done' ? `<span class="pr-pill is-success">${esc(t('ag.done', 'Hecho'))}</span>` : ''}
      </button>`;
  }

  function paintTzNote() {
    const el = document.getElementById('tz-note');
    const others = athletes.filter(a => TZ().valid(a.timezone) && a.timezone !== myTz());
    if (!others.length) { el.hidden = true; return; }
    const cities = [...new Set(others.map(a => TZ().city(a.timezone)))];
    el.innerHTML = `<i class="ti ti-world-pin"></i><span>${esc(t('ag.tzNote',
      `Las horas de abajo son las tuyas (${TZ().label(myTz())}). Tienes atletas en ${cities.join(', ')}; debajo de cada hora está la de ellos.`,
      { mine: TZ().label(myTz()), cities: cities.join(', ') }))}</span>`;
    el.hidden = false;
  }

  // ── Ir a lo que se toca ──────────────────────────────────────────────────
  // Cada tipo lleva a su editor; lo que no tiene editor propio lleva a la
  // semana del atleta, que es donde se cambia.
  document.getElementById('days').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ev]');
    if (!b) return;
    const ty = b.dataset.type;
    const to = ['gym', 'field'].includes(ty) ? 'Session.html?event=' + b.dataset.ev
             : ty === 'meal' ? 'Meal.html?event=' + b.dataset.ev
             : 'Athlete.html?id=' + b.dataset.ath + '#week';
    window.location.href = to;
  });

  document.getElementById('prev').addEventListener('click',  () => { monday = W().addDays(monday, -7); load(); });
  document.getElementById('next').addEventListener('click',  () => { monday = W().addDays(monday,  7); load(); });
  document.getElementById('today').addEventListener('click', () => { monday = W().mondayOf(window.prToday()); load(); });

  // ── Arranque ─────────────────────────────────────────────────────────────
  async function boot() {
    if (!(await window.requireCoach())) return;
    if (window.PR_I18N && window.PR_I18N.ready) { try { await window.PR_I18N.ready; } catch (e) {} }
    if (window.prSidebar) window.prSidebar.mount('week');

    const wsId = await window.getWorkspaceId();
    const { data } = await window.sb.from('athletes')
      .select('id,first_name,last_name,timezone')
      .eq('workspace_id', wsId).neq('status', 'archived').order('first_name');
    athletes = data || [];

    if (!athletes.length) {
      document.getElementById('no-athletes').hidden = false;
      if (window.PR_I18N) window.PR_I18N.applyTo(document);
      return;
    }

    monday = W().mondayOf(window.prToday());
    document.getElementById('board').hidden = false;
    await load();
    if (window.PR_I18N) window.PR_I18N.applyTo(document);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
