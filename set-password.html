<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — Proa</title>
<meta name="theme-color" content="#FF3D00">
<link rel="stylesheet" href="proa.css">
<link rel="stylesheet" href="auth.css">
<script src="assets/brand.js"></script>
<script src="assets/vendor/supabase-js-2.112.4.min.js"></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/i18n.js" defer></script>
</head>
<body class="pr">

<div class="auth-shell">
  <aside class="auth-brand">
    <div class="auth-brand-top">
      <span class="pr-logo-mark is-lg" data-brand-mark></span>
      <span>
        <span class="auth-brand-name">Proa</span>
        <span class="auth-brand-meta" data-i18n="brand.tagline">Entrenamiento individual</span>
      </span>
    </div>
    <div class="auth-brand-hero">
      <span class="auth-brand-eyebrow">Casi listo</span>
      <h2>Elige una contraseña <em>nueva</em>.</h2>
      <p>Después de guardarla entras directo a tu espacio.</p>
    </div>
  </aside>

  <main class="auth-form-wrap">
    <div class="auth-form">
      <div class="auth-mobile-brand">
        <span class="pr-logo-mark" data-brand-mark></span>
        <span class="pr-wordmark">Proa</span>
      </div>

      <h1>Nueva contraseña</h1>
      <p class="sub">Escribe la contraseña con la que vas a entrar de ahora en adelante.</p>

      <form id="pw-form" novalidate>
        <div class="auth-fields">
          <div class="pr-field">
            <label class="pr-label" for="password" data-i18n="auth.password">Contraseña</label>
            <input class="pr-input" type="password" id="password" autocomplete="new-password"
                   minlength="8" required data-i18n-ph="auth.passwordPh" placeholder="Al menos 8 caracteres">
          </div>
        </div>
        <div class="auth-actions">
          <button class="pr-btn is-primary is-lg is-block" type="submit" id="submit" data-i18n="common.save">Guardar</button>
        </div>
        <p class="auth-msg" id="msg" role="status" aria-live="polite" hidden></p>
      </form>
    </div>
  </main>
</div>

<script>
(function () {
  const form = document.getElementById('pw-form');
  const btn  = document.getElementById('submit');
  const msg  = document.getElementById('msg');
  const t = (k, fb) => (window.PR_I18N ? window.PR_I18N.t(k) : null) || fb;

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'auth-msg is-' + (kind || 'error');
    msg.hidden = false;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.hidden = true;
    const password = document.getElementById('password').value;
    if (password.length < 8) { show(t('auth.err.password', 'La contraseña tiene que tener al menos 8 caracteres.')); return; }

    btn.classList.add('is-busy');
    const { error } = await window.sb.auth.updateUser({ password });
    btn.classList.remove('is-busy');

    if (error) { show(window.prAuthError(error)); return; }

    window.resetContextCache();
    if (!(await window.goAfterAuth())) show(t('auth.err.generic', 'Algo salió mal. Prueba de nuevo.'));
  });
})();
</script>
</body>
</html>
