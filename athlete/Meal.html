<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="am.pageTitle">Mi menú — Proa</title>
<meta name="theme-color" content="#FF3D00">
<link rel="stylesheet" href="../proa.css">
<script src="../assets/brand.js"></script>
<script src="../assets/vendor/supabase-js-2.112.4.min.js"></script>
<script src="../assets/supabase-init.js"></script>
<script src="../assets/i18n.js" defer></script>
<script src="../assets/week-grid.js" defer></script>
<script src="../assets/nutrition-calc.js" defer></script>
<script src="../assets/athlete-log.js" defer></script>
<style>
  /* Se lee en la cocina o en el supermercado, con una mano. Misma forma que la
     sesión: si las dos pantallas del atleta se leyeran distinto, tendría que
     aprender dos. */
  .am { max-width: 560px; margin: 0 auto; padding: 0 18px 96px; }
  @media (min-width: 700px) { .am { padding-bottom: 40px; } }
  .am-top { display: flex; align-items: center; gap: 11px; padding: 18px 0 16px; }
  .am-top .pr-grow { min-width: 0; }
  .am-when { font: 700 10px/1 var(--pr-font-cond); letter-spacing: .18em; text-transform: uppercase; color: var(--pr-fg-muted); display: block; }
  .am-name { font: var(--pr-h2); text-transform: uppercase; letter-spacing: var(--pr-tr-h); color: var(--pr-fg-strong); margin: 4px 0 0; }
  .am-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }

  /* Un alimento por fila: qué, cuánto y cuánto suma. Las calorías van a la
     derecha, alineadas, porque la columna se lee de arriba abajo. */
  .am-list { padding: 6px 6px 10px; }
  .am-it { display: flex; align-items: baseline; gap: 12px; padding: 11px 10px; }
  .am-it + .am-it { border-top: var(--pr-bw) solid var(--pr-border-soft); }
  .am-it-body { flex: 1; min-width: 0; }
  .am-it-name { font: 700 14.5px/1.25 var(--pr-font-sans); color: var(--pr-fg-strong); }
  .am-it-qty {
    font: 700 12.5px/1 var(--pr-font-cond); letter-spacing: .06em;
    color: var(--pr-fg-muted); font-variant-numeric: tabular-nums; margin-top: 5px; display: block;
  }
  .am-it-note { font: var(--pr-body-sm); color: var(--pr-fg-faint); margin: 5px 0 0; }
  .am-it-k {
    font: 700 13px/1 var(--pr-font-cond); letter-spacing: .04em;
    color: var(--pr-fg-strong); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .am-it.is-free .am-it-k { color: var(--pr-fg-faint); }

  /* Comida, bebida y suplemento se leen aparte: un café y una creatina no son
     «lo que comí». El encabezado solo aparece si hay de más de un tipo. */
  .am-group {
    font: 700 10px/1 var(--pr-font-cond); letter-spacing: .16em; text-transform: uppercase;
    color: var(--pr-fg-faint); padding: 14px 10px 4px; display: block;
  }

  .am-total {
    display: flex; align-items: baseline; gap: 12px;
    padding: 13px 16px; border-top: var(--pr-bw) solid var(--pr-border);
  }
  .am-total-l { flex: 1; font: 700 13px/1 var(--pr-font-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--pr-fg-muted); }
  .am-total b { font: 700 19px/1 var(--pr-font-cond); font-variant-numeric: tabular-nums; color: var(--pr-fg-strong); }
  .am-macros {
    display: flex; gap: 14px; padding: 0 16px 14px;
    font: 700 12px/1 var(--pr-font-cond); letter-spacing: .06em;
    color: var(--pr-fg-muted); font-variant-numeric: tabular-nums;
  }
  .am-macros b { color: var(--pr-fg-strong); }

  /* El parte queda pegado abajo, igual que en la sesión. */
  .am-foot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    background: var(--pr-bg); border-top: var(--pr-bw) solid var(--pr-border);
  }
  .am-foot-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .am-foot .pr-btn { flex: 1; }

  @media (min-width: 700px) {
    .am-foot {
      position: static; z-index: auto;
      background: none; border-top: 0;
      padding: 22px 0 0;
    }
    .am-foot-in { justify-content: flex-end; }
    .am-foot .pr-btn { flex: 0 0 auto; }
  }

</style>
</head>
<body class="pr">

<div class="am">

  <header class="am-top">
    <a class="pr-icon-btn is-flush" href="Week.html" aria-label="Volver" data-i18n-attr="aria-label:common.back"><i class="ti ti-arrow-left"></i></a>
    <span class="pr-grow">
      <span class="am-when" id="when">&nbsp;</span>
      <h1 class="am-name" id="title">&nbsp;</h1>
    </span>
  </header>

  <div class="am-meta" id="meta"></div>

  <section class="pr-card has-strip" id="meal-card" style="--pr-strip:var(--pr-ev-meal)" hidden>
    <div class="am-list" id="items"></div>
    <div class="am-total">
      <span class="am-total-l" data-i18n="ml.mealTotal">Total de esta comida</span>
      <b id="meal-kcal">0</b><span>kcal</span>
    </div>
    <div class="am-macros" id="meal-macros"></div>
  </section>

  <section class="pr-empty" id="empty" hidden>
    <i class="ti ti-tools-kitchen-2"></i>
    <h3 data-i18n="am.empty.title">Todavía no hay nada cargado</h3>
    <p data-i18n="am.empty.body">Tu entrenador está armando esta comida.</p>
  </section>

</div>

<div class="am-foot" id="foot" hidden>
  <div class="am-foot-in">
    <span class="pr-pill" id="state" hidden></span>
    <!-- Un toque y listo. Contarle algo es para el que quiera, no un paso del
         camino: una comida se comió o no se comió. -->
    <button class="pr-btn is-ghost is-sm" id="say"><i class="ti ti-message"></i><span data-i18n="log.sayMeal">Contarle algo</span></button>
    <button class="pr-btn is-primary" id="log"><i class="ti ti-check"></i><span id="log-t" data-i18n="log.ate">Lo comí</span></button>
  </div>
</div>

<script>
(function () {
  const t = (k, fb, vars) => (window.PR_I18N ? window.PR_I18N.t(k, vars) : null) || fb;
  const esc = window.prEsc;
  const W = () => window.prWeek;
  const r1 = (n) => Math.round((Number(n) || 0) * 10) / 10;

  // EL TOTAL DEL DÍA NO VA ACÁ, y no es un olvido.
  //
  // Estuvo: las cuatro barras contra el objetivo, con «falta 1324» y «se pasó
  // 20». Se sacó por lo mismo que se sacaron del catálogo el alcohol y la
  // azúcar suelta: Proa es una app de salud y lo que se le pone delante a
  // alguien es una forma de recomendárselo. Contar calorías contra una meta,
  // todos los días, es el terreno donde empiezan las conductas alimentarias
  // desordenadas, y un deportista joven ya es población de riesgo.
  //
  // Además el número engañaba: «falta 1324» al mediodía solo quiere decir que
  // todavía no cenó, pero se lee como que va mal.
  //
  // El entrenador lo sigue viendo entero en Meal.html, que es quien decide la
  // nutrición. Acá va lo accionable: qué comer y cuánto de cada cosa.
  const eventId = new URLSearchParams(location.search).get('event');
  let ev = null, items = [];

  async function load() {
    // El join con foods es de conveniencia, no de necesidad: los macros y la
    // cantidad ya están EN la fila. Lo único que aporta es cómo se llama la
    // unidad —«2 huevos» y no «2 u»— y de qué tipo es. Un alimento propio del
    // entrenador puede no llegar, porque el catálogo de un espacio no es del
    // atleta, y entonces se muestra igual con lo que hay.
    const { data } = await window.sb.from('events')
      .select(`id,athlete_id,date,start_time,end_time,type,title,notes,location,status,athlete_note,
               meal_items(id,position,food_id,name,qty_g,unit_qty,qty_text,kcal,protein_g,carbs_g,fats_g,fiber_g,notes,
                 foods(food_group,unit_name))`)
      .eq('id', eventId).maybeSingle();
    if (!data) { window.location.replace('Week.html'); return; }
    ev = data;
    items = (data.meal_items || []).sort((a, b) => a.position - b.position);

    paint();
  }

  // Cuánto es, dicho como se dijo. Media taza se lee «1/2», no «0.5».
  function cantidad(it) {
    if (it.unit_qty != null) {
      const u = it.foods && it.foods.unit_name;
      const n = Number(it.unit_qty) <= 1 ? 1 : 2;
      return window.prNutri.formatAmount(it.unit_qty) + ' ' + t('ml.u.' + (u || 'unit'), '', { count: n });
    }
    if (it.qty_g != null) return r1(it.qty_g) + ' g';
    return it.qty_text || '';
  }

  function grupoDe(it) {
    const g = it.foods && it.foods.food_group;
    return g === 'drink' ? 'drink' : g === 'supp' ? 'supp' : 'food';
  }

  function paint() {
    const lang = (window.PR_I18N && window.PR_I18N.current) || 'es';
    document.getElementById('when').textContent =
      W().parseYMD(ev.date).toLocaleDateString(lang, { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('title').textContent = ev.title || t(W().EVENT_KEY[ev.type] || 'ev.meal');
    document.title = (ev.title || 'Proa') + ' — Proa';

    const time = ev.start_time
      ? W().hhmm(ev.start_time) + (ev.end_time ? '–' + W().hhmm(ev.end_time) : '') : null;
    document.getElementById('meta').innerHTML = [
      time ? `<span class="pr-pill">${esc(time)}</span>` : '',
      ev.location ? `<span class="pr-pill">${esc(ev.location)}</span>` : '',
      ev.notes ? `<span class="pr-pill">${esc(ev.notes)}</span>` : ''
    ].filter(Boolean).join('');

    document.getElementById('meal-card').hidden = !items.length;
    document.getElementById('empty').hidden = !!items.length;

    if (items.length) {
      const ORDEN = ['food', 'drink', 'supp'];
      const ordenados = items.slice().sort((a, b) =>
        ORDEN.indexOf(grupoDe(a)) - ORDEN.indexOf(grupoDe(b)) || a.position - b.position);
      const conGrupos = new Set(ordenados.map(grupoDe)).size > 1;
      let grupo = null;

      document.getElementById('items').innerHTML = ordenados.map(it => {
        const g = grupoDe(it);
        const head = (conGrupos && g !== grupo)
          ? `<span class="am-group" data-i18n="fg.${g}">${esc(t('fg.' + g, ''))}</span>` : '';
        grupo = g;

        const qty = cantidad(it);
        // Cargado por unidades, debajo va el peso: se cocina en gramos.
        const pie = [
          it.unit_qty != null && it.qty_g != null ? r1(it.qty_g) + ' g' : null,
          it.unit_qty != null || it.qty_g != null ? it.qty_text : null,
          it.notes
        ].filter(Boolean).join(' · ');
        // Un alimento sin calorías no es un error: el agua y el magnesio no
        // suman. Se muestra apagado en vez de escribir un cero.
        const sinK = !Number(it.kcal);

        return head + `<div class="am-it${sinK ? ' is-free' : ''}">
          <span class="am-it-body">
            <span class="am-it-name">${esc(it.name)}</span>
            ${qty ? `<span class="am-it-qty">${esc(qty)}</span>` : ''}
            ${pie ? `<p class="am-it-note">${esc(pie)}</p>` : ''}
          </span>
          <span class="am-it-k">${sinK ? '—' : Math.round(it.kcal) + ' kcal'}</span>
        </div>`;
      }).join('');

      const mt = window.prNutri.sumMacros(items);
      document.getElementById('meal-kcal').textContent = Math.round(mt.kcal);
      document.getElementById('meal-macros').innerHTML = [
        ['ml.p', mt.protein_g], ['ml.c', mt.carbs_g], ['ml.f', mt.fats_g]
      ].map(([k, v]) => `<span><b>${r1(v)}</b> ${esc(t(k, ''))}</span>`).join('');
    }

    paintState();
    if (window.PR_I18N) window.PR_I18N.applyTo(document);
  }

  function paintState() {
    const st = document.getElementById('state');
    if (ev.status === 'done') {
      st.className = 'pr-pill is-success';
      st.textContent = t('log.ateDone', 'Comido');
      st.hidden = false;
    } else if (ev.status === 'skipped') {
      st.className = 'pr-pill';
      st.textContent = t('log.ateSkipped', 'No lo comió');
      st.hidden = false;
    } else { st.hidden = true; }

    // Marcado, el botón deshace: el mismo toque para las dos cosas.
    const b = document.getElementById('log');
    const txt = document.getElementById('log-t');
    const hecho = ev.status === 'done';
    b.classList.toggle('is-primary', !hecho);
    b.classList.toggle('is-secondary', hecho);
    b.querySelector('i').className = hecho ? 'ti ti-arrow-back-up' : 'ti ti-check';
    txt.setAttribute('data-i18n', hecho ? 'log.undoAte' : 'log.ate');
    txt.textContent = t(hecho ? 'log.undoAte' : 'log.ate', hecho ? 'No lo comí' : 'Lo comí');

    document.getElementById('foot').hidden = false;
  }

  document.getElementById('log').addEventListener('click', () => window.prLog.quick(ev, load));
  document.getElementById('say').addEventListener('click', () => window.prLog.open(ev, load));

  async function boot() {
    if (!(await window.requireAthlete())) return;
    if (window.PR_I18N && window.PR_I18N.ready) { try { await window.PR_I18N.ready; } catch (e) {} }
    if (!eventId) { window.location.replace('Week.html'); return; }
    await load();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
