<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="aw.pageTitle">Mi semana — Proa</title>
<meta name="theme-color" content="#FF3D00">
<link rel="stylesheet" href="../proa.css">
<script src="../assets/brand.js"></script>
<script src="../assets/vendor/supabase-js-2.112.4.min.js"></script>
<script src="../assets/supabase-init.js"></script>
<script src="../assets/i18n.js" defer></script>
<script src="../assets/week-grid.js" defer></script>
<style>
  /* Se usa de parado en un gimnasio: una columna, todo grande, sin menú. */
  .aw { max-width: 560px; margin: 0 auto; padding: 0 18px 64px; }
  .aw-top { display: flex; align-items: center; gap: 11px; padding: 18px 0 20px; }
  .aw-top .pr-grow { min-width: 0; }
  .aw-ws { font: 700 10px/1 var(--pr-font-cond); letter-spacing: .18em; text-transform: uppercase; color: var(--pr-fg-muted); display: block; }
  .aw-name { font: var(--pr-h2); text-transform: uppercase; letter-spacing: var(--pr-tr-h); color: var(--pr-fg-strong); margin: 4px 0 0; }
  .aw-date { font: 700 11px/1 var(--pr-font-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--pr-accent-ink); margin-bottom: 14px; display: block; }

  .aw-cards { display: flex; flex-direction: column; gap: 14px; }
  .aw-cards > .pr-card { padding: 18px; }
  .aw-cards h3 { font: var(--pr-h3); text-transform: uppercase; letter-spacing: .04em; color: var(--pr-fg-strong); margin: 0 0 8px; }
  .aw-cards p { font: var(--pr-body); color: var(--pr-fg-muted); margin: 0; }

  /* La tarjeta de la ficha es un enlace entero: cuanto más grande el objetivo,
     mejor en un teléfono. */
  .aw-cta { display: block; text-decoration: none; color: inherit; transition: border-color var(--pr-dur-1); }
  .aw-cta:hover { border-color: var(--pr-accent); }
  .aw-arrow {
    display: flex; align-items: center; gap: 7px; margin-top: 14px;
    font: 700 11.5px/1 var(--pr-font-sans);
    letter-spacing: var(--pr-tr-btn); text-transform: uppercase;
    color: var(--pr-accent-ink);
  }

  /* Los bloques del día, en grande: es lo que se mira entre serie y serie. */
  .aw-today { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
  .aw-block {
    display: flex; align-items: stretch; gap: 12px;
    border: var(--pr-bw) solid var(--pr-border);
    border-radius: var(--pr-r-4);
    background: var(--pr-surface);
    overflow: hidden;
  }
  .aw-block i.bar { width: 5px; flex: none; display: block; }
  .aw-block-body { padding: 12px 14px 12px 0; min-width: 0; flex: 1; }
  .aw-block-top { display: flex; align-items: baseline; gap: 9px; }
  .aw-block-name { font: 700 15px/1.2 var(--pr-font-sans); color: var(--pr-fg-strong); }
  .aw-block-time { font: 700 12px/1 var(--pr-font-cond); letter-spacing: .08em; color: var(--pr-fg-muted); font-variant-numeric: tabular-nums; margin-left: auto; flex: none; }
  .aw-block-meta { font: var(--pr-body-sm); color: var(--pr-fg-muted); margin: 5px 0 0; }

  .aw-weekwrap { margin-top: 4px; }
  .aw-weekwrap .wk-day.is-date { width: 46px; }
  .aw-weekwrap .wk-track-cal { height: 34px; }

  .aw-foot { margin-top: 28px; display: flex; justify-content: center; }
</style>
</head>
<body class="pr">

<div class="aw">

  <header class="aw-top">
    <span class="pr-logo-mark" data-brand-mark></span>
    <span class="pr-grow">
      <span class="aw-ws" id="ws-name">&nbsp;</span>
      <h1 class="aw-name" id="hello">&nbsp;</h1>
    </span>
    <button class="pr-icon-btn" id="theme" aria-label="Cambiar tema"><i class="ti ti-moon"></i></button>
  </header>

  <span class="aw-date" id="today"></span>

  <div class="aw-cards">

    <a class="pr-card has-strip aw-cta pr-rise" id="intake-card" href="Intake.html" style="--i:0;--pr-strip:var(--pr-accent)" hidden>
      <h3 id="intake-title">&nbsp;</h3>
      <p id="intake-body">&nbsp;</p>
      <span class="aw-arrow"><span id="intake-cta"></span><i class="ti ti-arrow-right"></i></span>
    </a>

    <section class="pr-card pr-rise" style="--i:1" id="today-card" hidden>
      <h3 data-i18n="aw.todayTitle">Hoy</h3>
      <div class="aw-today" id="today-list"></div>
    </section>

    <section class="pr-card pr-rise" style="--i:2" id="week-card" hidden>
      <h3 data-i18n="aw.weekTitle">Tu semana</h3>
      <div class="wk aw-weekwrap">
        <div id="wk-scale"></div>
        <div id="wk-rows"></div>
      </div>
      <div id="wk-legend"></div>
    </section>

    <section class="pr-card has-strip pr-rise" id="soon-card" style="--i:1;--pr-strip:var(--pr-ev-gym)" hidden>
      <h3 data-i18n="aw.soon.title">Tu semana llega en breve</h3>
      <p data-i18n="aw.soon.body">Tu entrenador está armando tu planificación. Cuando la publique, la vas a ver acá: gimnasio, campo, comidas y recuperación, día por día.</p>
    </section>

  </div>

  <div class="aw-foot">
    <button class="pr-btn is-ghost is-sm" id="logout" data-i18n="nav.logout">Salir</button>
  </div>

</div>

<script>
(function () {
  const t = (k, fb, vars) => (window.PR_I18N ? window.PR_I18N.t(k, vars) : null) || fb;
  const esc = window.prEsc;
  const W = () => window.prWeek;

  document.getElementById('theme').addEventListener('click', () => window.prBrand.toggleTheme());
  document.getElementById('logout').addEventListener('click', () => window.logout('../Login.html'));

  function paintToday(events) {
    const today = window.prToday();
    const mine = events.filter(e => e.date === today)
      .sort((a, b) => W().toMin(a.start_time || '00:00') - W().toMin(b.start_time || '00:00'));

    document.getElementById('today-card').hidden = !mine.length;
    if (!mine.length) return;

    document.getElementById('today-list').innerHTML = mine.map(e => {
      const name = e.title || t(W().EVENT_KEY[e.type] || 'ev.other', '');
      const time = e.start_time
        ? W().hhmm(e.start_time) + (e.end_time ? '–' + W().hhmm(e.end_time) : '')
        : '';
      const meta = [e.location, e.notes].filter(Boolean).join(' · ');
      return `<div class="aw-block">
        <i class="bar" style="background:${W().EVENT_COLOR[e.type] || W().EVENT_COLOR.other}"></i>
        <div class="aw-block-body">
          <div class="aw-block-top">
            <span class="aw-block-name">${esc(name)}</span>
            ${time ? `<span class="aw-block-time">${esc(time)}</span>` : ''}
          </div>
          ${meta ? `<p class="aw-block-meta">${esc(meta)}</p>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  async function boot() {
    if (!(await window.requireAthlete())) return;
    if (window.PR_I18N && window.PR_I18N.ready) { try { await window.PR_I18N.ready; } catch (e) {} }

    document.getElementById('wk-scale').outerHTML = W().scaleHtml();
    document.getElementById('wk-legend').outerHTML = W().eventLegendHtml();

    // Las reglas de acceso ya limitan al atleta a su propia fila.
    const { data } = await window.sb.from('athletes')
      .select('id,first_name,last_name,workspaces(name,accent)')
      .limit(1).maybeSingle();

    const first = (data && data.first_name) || '';
    document.getElementById('hello').textContent = t('aw.hello', 'Hola, ' + first, { name: first });
    if (data && data.workspaces) {
      document.getElementById('ws-name').textContent = data.workspaces.name;
      if (window.prBrand) window.prBrand.applyAccent(data.workspaces.accent);
    }

    // Fecha local: prToday() da el día del atleta, no el de UTC.
    const lang = (window.PR_I18N && window.PR_I18N.current) || 'es';
    const [y, m, d] = window.prToday().split('-').map(Number);
    document.getElementById('today').textContent =
      new Date(y, m - 1, d).toLocaleDateString(lang, { weekday: 'long', day: 'numeric', month: 'long' });

    if (!data) { if (window.PR_I18N) window.PR_I18N.applyTo(document); return; }

    const monday = W().mondayOf(window.prToday());
    const dates  = W().weekDates(monday);

    const [intakeQ, slotQ, evQ] = await Promise.all([
      window.sb.from('athlete_intake').select('completed_at').eq('athlete_id', data.id).maybeSingle(),
      window.sb.from('availability_slots').select('weekday,start_time,end_time,kind,label').eq('athlete_id', data.id),
      window.sb.from('events').select('id,date,start_time,end_time,type,title,notes,location,status')
        .eq('athlete_id', data.id).gte('date', monday).lte('date', dates[6]).order('start_time')
    ]);

    const events = evQ.data || [];

    // ¿Ya completó su ficha? Es lo primero que tiene que hacer.
    const done = !!(intakeQ.data && intakeQ.data.completed_at);
    const card = document.getElementById('intake-card');
    document.getElementById('intake-title').textContent = t(done ? 'aw.intake.doneTitle' : 'aw.intake.title');
    document.getElementById('intake-body').textContent  = t(done ? 'aw.intake.doneBody'  : 'aw.intake.body');
    document.getElementById('intake-cta').textContent   = t(done ? 'aw.intake.doneCta'   : 'aw.intake.cta');
    if (done) card.style.setProperty('--pr-strip', 'var(--pr-ev-field)');
    card.hidden = false;

    paintToday(events);

    if (events.length) {
      W().render({ host: 'wk-rows', dates, slots: slotQ.data || [], events, editable: false });
      document.getElementById('week-card').hidden = false;
    } else {
      document.getElementById('soon-card').hidden = false;
    }

    if (window.PR_I18N) window.PR_I18N.applyTo(document);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
