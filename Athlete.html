<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proa</title>
<meta name="theme-color" content="#FF3D00">
<link rel="stylesheet" href="proa.css">
<script src="assets/brand.js"></script>
<script src="assets/vendor/supabase-js-2.112.4.min.js"></script>
<script src="assets/supabase-init.js"></script>
<script src="assets/i18n.js" defer></script>
<script src="assets/week-grid.js" defer></script>
<script src="assets/tz.js"></script>
<script src="assets/recovery-methods.js" defer></script>
<script src="assets/sortable.js"></script>
<script src="assets/week-board.js" defer></script>
<style>
  .ap-wrap { max-width: 900px; }
  .ap-hero { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .ap-hero h1 { font: var(--pr-h1); text-transform: uppercase; letter-spacing: var(--pr-tr-h); color: var(--pr-fg-strong); margin: 0; }
  .ap-hero-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .ap-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .ap-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .ap-card-head h2 { font: var(--pr-h3); text-transform: uppercase; letter-spacing: .05em; color: var(--pr-fg-strong); margin: 0; }
  .ap-dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 20px; }
  .ap-dl dt { font: 700 10px/1 var(--pr-font-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--pr-fg-muted); margin-bottom: 5px; }
  .ap-dl dd { margin: 0; font: 500 14.5px/1.4 var(--pr-font-sans); color: var(--pr-fg-strong); }
  .ap-dl dd.is-empty { color: var(--pr-fg-faint); font-weight: 400; }
  .ap-prose { font: var(--pr-body); color: var(--pr-fg); white-space: pre-wrap; margin: 0; }
  .ap-prose.is-empty { color: var(--pr-fg-faint); }
  .ap-block { margin-bottom: 22px; }
  .ap-tabs { margin-bottom: 20px; }
  .ap-tz { margin-top: 18px; padding-top: 16px; border-top: var(--pr-bw) solid var(--pr-border-soft); }
  .ap-pane[hidden] { display: none; }

  /* Banderas de salud: lo que un preparador tiene que ver ANTES de escribir la
     primera serie. Va arriba de todo y con el color de peligro. */
  .ap-flags {
    border: var(--pr-bw) solid var(--pr-danger-bd);
    background: var(--pr-danger-bg);
    border-radius: var(--pr-r-5);
    padding: 18px 20px;
    margin-bottom: 22px;
  }
  .ap-flags-head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  .ap-flags-head .ti { color: var(--pr-danger); font-size: 19px; }
  .ap-flags-head h2 { font: var(--pr-h3); text-transform: uppercase; letter-spacing: .05em; color: var(--pr-danger); margin: 0; }
  .ap-flags dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 20px; margin: 0; }
  .ap-flags dt { font: 700 10px/1 var(--pr-font-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--pr-danger); margin-bottom: 5px; }
  .ap-flags dd { margin: 0; font: 500 14px/1.45 var(--pr-font-sans); color: var(--pr-fg-strong); white-space: pre-wrap; }

</style>
</head>
<body class="pr">

<div class="pr-shell">
  <aside class="pr-shell-side" id="pr-side-root"></aside>

  <div class="pr-shell-main">
    <header class="pr-topbar">
      <a class="pr-icon-btn is-flush" href="Athletes.html" aria-label="Volver"><i class="ti ti-arrow-left"></i></a>
      <h1 id="top-name">&nbsp;</h1>
    </header>

    <main class="pr-page ap-wrap" id="main" hidden>

      <div class="ap-hero">
        <span class="pr-avatar is-lg" id="av"></span>
        <div class="pr-grow">
          <h1 id="name">&nbsp;</h1>
          <div class="ap-hero-meta" id="meta"></div>
        </div>
        <a class="pr-btn is-primary" id="btn-intake" href="#"><i class="ti ti-clipboard-text"></i><span data-i18n="ap.editIntake">Editar anamnesis</span></a>
      </div>

      <div class="pr-tabs ap-tabs" role="tablist">
        <button class="pr-tab is-on" data-tab="week" role="tab" data-i18n="ap.tabWeek">Su semana</button>
        <button class="pr-tab" data-tab="profile" role="tab" data-i18n="ap.tabProfile">Su ficha</button>
      </div>

      <!-- La semana planificada: la pantalla de trabajo, dentro del perfil.
           El tablero se lo trae assets/week-board.js, modales incluidos. -->
      <div class="ap-pane" id="pane-week">
        <section class="pr-card pr-card-pad" id="wb-host"></section>
      </div>

      <div class="ap-pane" id="pane-profile" hidden>

      <section class="ap-flags" id="flags" hidden>
        <div class="ap-flags-head">
          <i class="ti ti-alert-triangle"></i>
          <h2 data-i18n="ap.flags">Atención</h2>
        </div>
        <dl id="flags-list"></dl>
      </section>

      <div class="ap-cards">
        <section class="pr-card pr-card-pad has-strip" style="--pr-strip:var(--pr-ev-gym)">
          <dl class="ap-dl" id="basics"></dl>
          <div class="pr-field ap-tz">
            <label class="pr-label" for="ap-tz" data-i18n="ap.timezone">Dónde vive</label>
            <select class="pr-select" id="ap-tz"></select>
            <span class="pr-hint" data-i18n="ap.timezoneHint">Sus horarios se guardan con el reloj de este lugar. Si tú estás en otro huso, la app te los traduce.</span>
          </div>
        </section>
        <section class="pr-card pr-card-pad">
          <dl class="ap-dl" id="numbers"></dl>
        </section>
      </div>

      <section class="pr-card pr-card-pad ap-block">
        <div class="ap-card-head"><h2 data-i18n="in.week">Su semana ocupada</h2></div>
        <div class="wk">
          <div class="wk-scale" aria-hidden="true"><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span></div>
          <div id="wk-rows"></div>
        </div>
        <p class="wk-free" id="free"></p>
      </section>

      <section class="pr-card pr-card-pad ap-block" id="goal-card">
        <div class="ap-card-head"><h2 data-i18n="in.goal">Objetivo</h2></div>
        <p class="ap-prose" id="goals"></p>
      </section>

      <section class="pr-card pr-card-pad ap-block">
        <div class="ap-card-head"><h2 data-i18n="ap.contact">Contacto</h2></div>
        <dl class="ap-dl" id="contact"></dl>
      </section>

      <section class="pr-card pr-card-pad ap-block" id="hist-card">
        <div class="ap-card-head"><h2 data-i18n="in.history">Historial</h2></div>
        <dl class="ap-dl">
          <div><dt data-i18n="in.injuries">Lesiones previas</dt><dd id="injuries"></dd></div>
          <div><dt data-i18n="in.current">Molestias actuales</dt><dd id="current"></dd></div>
        </dl>
      </section>

      </div><!-- /pane-profile -->

    </main>
  </div>
</div>

<script src="assets/sidebar.js" defer></script>
<script>
(function () {
  const t = (k, fb, vars) => (window.PR_I18N ? window.PR_I18N.t(k, vars) : null) || fb;
  const esc = window.prEsc;
  const id = new URLSearchParams(location.search).get('id');


  const val = (v, empty) => v === null || v === undefined || v === ''
    ? `<span class="is-empty">${esc(empty || t('ap.noData', 'Sin cargar'))}</span>` : esc(String(v));

  function age(birth) {
    if (!birth) return null;
    const [y, m, d] = birth.split('-').map(Number);
    const today = new Date();
    let a = today.getFullYear() - y;
    if (today.getMonth() + 1 < m || (today.getMonth() + 1 === m && today.getDate() < d)) a--;
    return a;
  }

  async function boot() {
    if (!(await window.requireCoach())) return;
    if (window.PR_I18N && window.PR_I18N.ready) { try { await window.PR_I18N.ready; } catch (e) {} }
    if (!id) { window.location.replace('Athletes.html'); return; }
    if (window.prSidebar) window.prSidebar.mount('athletes');

    const { data: a } = await window.sb.from('athletes')
      .select('*, athlete_accounts(user_id), athlete_intake(*)')
      .eq('id', id).maybeSingle();
    if (!a) { window.location.replace('Athletes.html'); return; }

    const intake = Array.isArray(a.athlete_intake) ? a.athlete_intake[0] : a.athlete_intake;
    const full = `${a.first_name} ${a.last_name || ''}`.trim();

    document.title = full + ' — Proa';
    document.getElementById('top-name').textContent = full;
    document.getElementById('name').textContent = full;
    document.getElementById('av').textContent = window.prInitials(full);
    document.getElementById('btn-intake').href = 'Intake.html?id=' + id;

    const linked = a.athlete_accounts && a.athlete_accounts.length;
    document.getElementById('meta').innerHTML = [
      `<span class="pr-pill ${a.status === 'active' ? 'is-success' : a.status === 'paused' ? 'is-warning' : ''}">${esc(t('ath.f.' + a.status))}</span>`,
      linked ? `<span class="pr-pill is-success"><i class="ti ti-check"></i>${esc(t('ath.st.linked'))}</span>`
             : `<span class="pr-pill">${esc(t('ath.st.none'))}</span>`,
      a.club_name ? `<span class="pr-pill">${esc(a.club_name)}</span>` : ''
    ].join('');

    const dl = (rows, host) => {
      document.getElementById(host).innerHTML = rows
        .map(([k, v]) => `<div><dt data-i18n="${k}">${esc(t(k))}</dt><dd class="${v ? '' : 'is-empty'}">${val(v)}</dd></div>`)
        .join('');
    };

    const yrs = age(a.birth_date);
    dl([
      ['ap.age',      yrs !== null ? t('ap.years', yrs + ' años', { n: yrs }) : null],
      ['ath.sex',     a.sex ? t('ath.sex.' + a.sex) : null],
      ['ap.position', a.position],
      ['ath.level',   a.level ? t('ath.lv.' + a.level) : null],
      ['ath.side',    a.dominant_side ? t('ath.side.' + a.dominant_side) : null],
      ['ap.club',     a.club_name]
    ], 'basics');

    dl([
      ['in.height',      intake && intake.height_cm ? intake.height_cm + ' cm' : null],
      ['in.weight',      intake && intake.weight_kg ? intake.weight_kg + ' kg' : null],
      ['in.sleepHours',  intake && intake.sleep_hours ? intake.sleep_hours + ' h' : null],
      ['in.sessions',    intake && intake.sessions_per_week],
      ['in.gymAccess',   intake && intake.gym_access ? t('in.gym.' + intake.gym_access) : null],
      ['in.lifting',     intake && intake.lifting_experience ? t('in.lift.' + intake.lifting_experience) : null]
    ], 'numbers');

    dl([
      ['auth.email',    a.email],
      ['ath.phone',     a.phone],
      ['in.emName',     intake && intake.emergency_name],
      ['in.emPhone',    intake && intake.emergency_phone],
      ['in.emRelation', intake && intake.emergency_relation]
    ], 'contact');

    // ── Banderas de salud ──
    // Solo aparece la tarjeta si de verdad hay algo que mirar. Un aviso rojo
    // permanente y vacío se vuelve invisible a los dos días.
    const flags = [
      ['in.conditions', intake && intake.conditions],
      ['in.medication', intake && intake.medication],
      ['in.allergies',  intake && intake.allergies],
      ['in.current',    intake && intake.current_issues],
      ['in.family',     intake && intake.family_history],
      ['in.surgeries',  intake && intake.surgeries]
    ].filter(([, v]) => v);

    if (intake && intake.medical_clearance === false) {
      flags.unshift(['in.clearance', t('ap.noClearance', 'No tiene apto físico')]);
    }
    const flagBox = document.getElementById('flags');
    flagBox.hidden = flags.length === 0;
    if (flags.length) {
      document.getElementById('flags-list').innerHTML = flags
        .map(([k, v]) => `<div><dt data-i18n="${k}">${esc(t(k))}</dt><dd>${esc(v)}</dd></div>`).join('');
    }

    const goals = intake && intake.goals;
    const goalEl = document.getElementById('goals');
    goalEl.textContent = goals || t('ap.noData', 'Sin cargar');
    goalEl.classList.toggle('is-empty', !goals);

    document.getElementById('injuries').innerHTML = val(intake && intake.injury_history);
    document.getElementById('current').innerHTML  = val(intake && intake.current_issues);

    const { data: slots } = await window.sb.from('availability_slots')
      .select('weekday,start_time,end_time,kind,label')
      .eq('athlete_id', id).order('weekday').order('start_time');
    window.prWeek.render({ host: 'wk-rows', slots: slots || [], editable: false });
    const h = window.prWeek.freeHours(slots || []);
    document.getElementById('free').innerHTML = (slots && slots.length)
      ? t('ap.free', `Le quedan <b>${h} h</b> libres en la semana, entre las 06:00 y las 24:00.`, { hours: h })
      : `<span style="color:var(--pr-fg-faint)">${esc(t('ap.noWeek', 'Todavía no cargaste sus horarios fijos.'))}</span>`;

    // ── Dónde vive ──
    // El huso del atleta es lo que permite decirle al entrenador «esto es a
    // las cuatro de la mañana tuyas». Si nunca se cargó, se propone el del
    // entrenador, que es lo más probable — pero se guarda solo si lo elige.
    const tzSel = document.getElementById('ap-tz');
    const mine = window.prTz.mine();
    const cur = window.prTz.valid(a.timezone) ? a.timezone : '';
    tzSel.innerHTML = `<option value="">${esc(t('ap.tzNone', 'Sin definir') + ' — ' + t('ap.tzAssume', 'se supone el tuyo') + ': ' + window.prTz.label(mine))}</option>`
      + window.prTz.list().map(z =>
          `<option value="${esc(z)}"${z === cur ? ' selected' : ''}>${esc(window.prTz.label(z))}</option>`).join('');
    tzSel.value = cur;
    tzSel.addEventListener('change', async () => {
      const v = tzSel.value || null;
      const { error } = await window.sb.from('athletes').update({ timezone: v }).eq('id', id);
      if (error) { window.prToast(error.message, 'danger'); return; }
      a.timezone = v;
      window.prToast(t('ap.tzSaved', 'Listo. Sus horarios se leen con el reloj de ahí.'), 'success');
      await window.prWeekBoard.mount({ host: 'wb-host', athlete: a });
    });

    // ── Pestañas ──
    document.querySelector('.ap-tabs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      document.querySelectorAll('.ap-tabs .pr-tab').forEach(x => x.classList.toggle('is-on', x === b));
      document.getElementById('pane-week').hidden    = b.dataset.tab !== 'week';
      document.getElementById('pane-profile').hidden = b.dataset.tab !== 'profile';
      try { history.replaceState(null, '', '?id=' + id + '#' + b.dataset.tab); } catch (err) {}
    });
    if (location.hash === '#profile') {
      document.querySelector('[data-tab="profile"]').click();
    }

    document.getElementById('main').hidden = false;
    if (window.PR_I18N) window.PR_I18N.applyTo(document);

    // El tablero se monta al final: necesita que la página ya esté visible
    // para poder medir la grilla.
    await window.prWeekBoard.mount({ host: 'wb-host', athlete: a });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
